plugins { id 'com.android.application' }

android {
    buildFeatures { buildConfig true }
    namespace 'dev.jamescullimore.tinyracers.spike'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.jamescullimore.tinyracers.spike'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0-hackathon'
        buildConfigField 'String', 'RELAY_ORIGIN', '"' + providers.gradleProperty('relayOrigin').getOrElse('https://tiny-racers.tiny-racers-relay.workers.dev') + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'com.google.zxing:core:3.5.3'
}
